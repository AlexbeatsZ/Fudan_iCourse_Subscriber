<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程库</title>
<style>
:root{color-scheme:dark;--ink:#ededeb;--muted:#a2a29e;--paper:#141414;--line:#333331;--accent:#e6e5df;--wash:#282827;--white:#1b1b1b;font-family:"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}button,input,select,summary{font:inherit}button,summary{cursor:pointer}button{border:1px solid transparent;background:transparent;color:var(--ink);border-radius:5px;padding:8px 12px}button:hover,summary:hover{background:var(--wash)}button:disabled{opacity:.35;cursor:not-allowed}:focus-visible{outline:2px solid #d8d7ce;outline-offset:4px}header{height:68px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand strong{font-weight:550;font-size:16px;letter-spacing:2px}.mark{width:19px;height:21px;border:1px solid #b1b1ac;border-left:5px solid #e4e4df}header nav{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:14px}header nav>button{color:var(--muted)}main{max-width:1660px;margin:auto;padding:0 36px 36px}#notice:empty{display:none}#notice{padding:12px 0;color:#d3bf97;font-size:14px}#library{max-width:1080px;margin:64px auto}h1{font-size:34px;line-height:1.25;font-weight:550;letter-spacing:-.8px;margin:12px 0 20px}h2{font-size:19px;line-height:1.4;font-weight:550;margin:0}.muted{color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:2px;color:var(--muted)}.section-heading{display:flex;justify-content:space-between;align-items:center;margin:48px 0 12px}.section-heading h2{font-size:15px}.section-heading>span{font-size:13px}.resume-card{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:28px 0 30px;border-bottom:1px solid var(--line)}.resume-info{flex:1;max-width:650px}.resume-card h2{font-size:27px;margin:16px 0 8px;font-weight:500}.resume-card p{margin:0 0 20px;font-size:14px}.primary{background:#e6e5df;color:#181818;padding:11px 20px;font-weight:600}.primary:hover{background:#fff}.course-grid,.lesson-list{display:grid}.course,.lesson{display:flex;align-items:center;gap:28px;border-radius:0;text-align:left;border-bottom:1px solid var(--line);padding:25px 8px}.course h2{margin:0 0 8px;font-size:19px}.course .muted{font-size:14px}.course-status{margin-left:auto;color:var(--muted);font-size:14px}.row-arrow{font-size:23px;margin-left:16px}.back{color:var(--muted);padding:0;margin:0 0 24px}.lesson-info{display:flex;flex-direction:column;gap:7px;flex:1}.lesson-info b{font-size:17px;font-weight:500}.lesson-info .muted,.lesson-progress,.row-action{font-size:14px}.lesson-progress{color:var(--muted)}.lesson-info progress{max-width:320px}.row-action{min-width:60px}progress{display:block;appearance:none;width:100%;height:3px;border:0;background:#353533;color:#cfcdc2}progress::-webkit-progress-bar{background:#353533}progress::-webkit-progress-value{background:#cfcdc2}progress::-moz-progress-bar{background:#cfcdc2}.workspace-heading{display:flex;align-items:center;gap:16px;min-height:78px;font-size:15px}.workspace-heading .back{margin:0;padding:5px 0}.workspace-heading h1{font-size:16px;font-weight:500;letter-spacing:0;margin:0}.slash{color:#646460}#course-title{color:var(--muted)}#session-clock{margin-left:auto;color:var(--muted);font:13px "Cascadia Mono",Consolas,monospace}.workspace{border-top:1px solid var(--line)}.viewer{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:1px;background:var(--line);align-items:stretch}.viewer>div,.viewer>figure{background:#191919;min-width:0}.surface-label,.slide-header{height:42px;display:flex;align-items:center;padding:0 16px;color:var(--muted);font-size:13px}.slide-header{justify-content:space-between}.screen{background:#090909;display:flex;align-items:center;justify-content:center;min-height:220px;height:calc(100% - 42px)}video{display:block;width:100%;max-height:49vh;background:#090909}video::cue{font-size:24px;background:rgba(0,0,0,.84);color:#fff;line-height:1.5;text-shadow:0 2px 3px #000}video:fullscreen{height:100%;max-height:none;object-fit:contain}video:fullscreen::cue{font-size:clamp(28px,4.26vh,72px)}.slide{margin:0;display:flex;flex-direction:column;min-height:0}.slide-img-wrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:12px 16px;cursor:pointer}.slide-img-wrap img{width:100%;max-height:35vh;object-fit:contain}.slide-img-wrap img:not([src]){visibility:hidden}.slide-sub-container{display:none;padding:14px 18px;min-height:84px;text-align:center;background:#191919}.viewer.focus-slide .slide-sub-container{display:block}.slide-sub-text{font-size:28px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}.viewer.focus-slide{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}.viewer.focus-slide #slide-box{order:0}.viewer.focus-slide #video-col{order:1}.viewer.focus-slide .slide-img-wrap img{max-height:48vh}.viewer.focus-slide .slide-sub-text{font-size:32px}.toolbar{display:flex;align-items:center;gap:18px;padding:10px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}.control-group{display:flex;align-items:center;gap:10px}.control-group+.control-group{border-left:1px solid var(--line);padding-left:18px}.nav-btn{padding:5px 9px;font-size:13px}.inline-label{display:flex;align-items:center;gap:8px;white-space:nowrap}.inline-label input[type=checkbox]{width:auto}.toolbar select{padding:5px 8px;background:#242424;border:1px solid var(--line);border-radius:4px;color:var(--ink)}.toolbar input[type=number]{width:65px;padding:5px}.playback-menu{margin-left:auto}.menu{position:relative}.menu summary{list-style:none;padding:8px 10px;border-radius:4px}.menu summary::-webkit-details-marker{display:none}.menu summary:after{content:'⌄';margin-left:8px;color:var(--muted)}.popover{position:absolute;right:0;top:calc(100% + 8px);z-index:10;min-width:200px;background:#222221;border:1px solid #42423e;border-radius:6px;padding:8px;displ xt{font-size:clamp(28px,4.86vh,76px);font-weight:500;color:#fff;text-align:center;line-height:1.4;overflow-wrap:anywhere}@media(max-width:850px){header{padding:0 20px;height:60px}main{padding:0 18px 24px}#library{margin:36px auto}.viewer,.viewer.focus-slide{grid-template-columns:1fr}.viewer.focus-slide #video-col,.viewer.focus-slide #slide-box{order:unset}.workspace-heading{flex-wrap:wrap;gap:8px;padding:15px 0}.workspace-heading #course-title{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toolbar{flex-wrap:wrap;gap:8px}.control-group+.control-group{padding-left:8px}.course,.lesson{gap:12px;flex-wrap:wrap}.course-status{margin-left:0;width:100%}.row-arrow{display:none}.resume-card{flex-wrap:wrap;gap:14px}.resume-card h2{font-size:24px}.resume-info{min-width:220px}.tabs{gap:22px}.tabs>span{display:none}.transcript-panel{padding:0}.cue{gap:10px;padding:10px 6px}.slide-img-wrap img{max-height:45vh}.slide-sub-text,.viewer.focus-slide .slide-sub-text{font-size:26px}.lesson-progress{margin-left:auto}.lesson-info{min-width:160px}h1{font-size:29px}}@media(prefers-reduced-motion:no-preference){button,summary{transition:background .12s}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true"></span><strong>课程库</strong></div><nav><details class="menu"><summary>管理课程</summary><div class="popover"><button id="download">检查并下载</button><button id="transfer">立即转存</button><button id="sync">同步字幕</button></div></details><button id="settings">设置</button></nav></header>
<main><div id="notice" role="status" class="muted"></div><section id="library"></section>
<section id="player" class="hidden">
<div class="workspace-heading"><button class="back" id="return">← 课次</button><div id="course-title"></div><span class="slash">/</span><h1 id="lesson-title"></h1><time id="session-clock">0:00</time></div>
<div class="workspace">
<div class="viewer" id="viewer-grid">
<div id="video-col"><div class="surface-label">课堂视频</div><div class="screen"><video id="video" controls preload="metadata"></video></div></div>
<figure class="slide" id="slide-box"><div class="slide-header"><span id="slide-caption">当前课件</span><button id="zoom-slide" class="nav-btn" title="全屏课件 (Z)">全屏 ↗</button></div><div class="slide-img-wrap" id="slide-wrap" title="点击切换课件优先"><img id="slide" alt="当前课件"></div><div class="slide-sub-container" id="slide-sub-box"><div class="slide-sub-text" id="slide-sub-text"></div></div></figure>
</div>
<div class="toolbar"><div class="control-group"><button id="prev-lesson" class="nav-btn" title="上一节 ([)">← 上一节</button><button id="next-lesson" class="nav-btn" title="下一节 (])">下一节 →</button></div><div class="control-group"><button id="toggle-focus-tb" class="nav-btn" title="切换主屏 (S)">课件优先</button><label class="inline-label">倍速 <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label></div><details class="menu playback-menu"><summary>播放设置</summary><div class="popover"><label class="inline-label">字幕偏移 <input id="offset" type="number" value="0" step="0.5" aria-label="字幕偏移秒数"> 秒</label><label class="inline-label"><input type="checkbox" id="autoplay" checked>自动连播下一节</label><button id="pip-btn">画中画</button><p class="key-help">空格 播放 / 暂停<br>← → 快退 / 快进 5 秒<br>↑ ↓ 音量 · F 视频全屏<br>S 切换主屏 · Z 全屏课件</p></div></details></div>
<div class="transcript-panel"><div class="tabs"><button id="transcript-tab" aria-selected="true">逐句字幕</button><button id="slides-tab" aria-selected="false">课件目录</button><span>点击内容跳转播放</span></div><div id="cues" class="timeline"></div><div id="pages" class="timeline hidden"></div></div>
</div></section></main>
<dialog id="slide-lightbox"><div style="display:flex;flex-direction:column;width:100%;height:100%;position:relative"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#1b1b1b;color:#fff"><strong id="lightbox-caption" style="font-size:16px">课件原图放大</strong><div style="display:flex;gap:10px;align-items:center"><button id="lightbox-pip" class="nav-btn" style="background:#292929;color:#eee;border:1px solid #444">画中画</button><button id="close-lightbox" class="nav-btn" style="background:#292929;color:#eee">✕ 关闭 (Esc/Z)</button></div></div><div class="lightbox-body"><img id="lightbox-img" alt="全屏课件"></div><div class="lightbox-subtitles"><div id="lightbox-sub-text"></div></div></div></dialog>
<dialog id="dialog"><form id="form"><h2>课程库设置</h2><label>视频目录<input name="destination" required></label><label>网络盘不可用时暂存到<input name="fallback" required></label><label>订阅课程编号或链接（逗号分隔）<input name="courses" required></label><label>每天自动转存时间<input name="transfer_time" type="time" required></label><details><summary>复旦账号环境变量</summary><p class="muted">保存为 FUDAN_STUID、FUDAN_UISPSW。以后也可直接在 Windows 环境变量中修改。</p><label>学号<input name="account" autocomplete="off"></label><label>密码（留空不修改）<input name="password" type="password" autocomplete="new-password"></label></details><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);let state,course,lesson,pages=[],cueRows=[],pageRows=[],originalCues=[],activeCue=-1;const video=$('video');
const stamp=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function media(c,file){return '/media/'+c.root+'/'+encodeURIComponent(c.folder)+'/'+file.split('/').map(encodeURIComponent).join('/')}
async function refresh(show=true){state=await(await fetch('/api/library')).json();if(show)showLibrary();$('notice').textContent=state.running?'正在处理，已下载的视频可直接观看。':state.last.errors?.length?'上次任务有未完成项目，点击检查并下载可重试。':state.last.error?'上次任务未完成，请检查网络和环境变量。':state.courses?.length?'':!state.configured?'请先在设置中保存复旦账号，或设置 FUDAN_STUID / FUDAN_UISPSW。':'视频目录暂无课程录像。'}
function progress(c,l){return Math.max(0,Number(localStorage.getItem('progress/'+c.folder+'/'+l.name))||0)}
function duration(c,l){return Number(localStorage.getItem('duration/'+c.folder+'/'+l.name))||0}
function progressLabel(c,l){const t=progress(c,l),d=duration(c,l);return t>0?'看到 '+stamp(t)+(d?' / '+stamp(d):''):'尚未开始'}
function progressBar(c,l){const d=duration(c,l);if(!d)return null;const bar=el('progress');bar.max=d;bar.value=Math.min(progress(c,l),d);bar.setAttribute('aria-label',l.name+' 播放进度');return bar}
function resumePanel(c,l,compact=false){const panel=el('div',undefined,'resume-card'),info=el('div',undefined,'resume-info');info.append(el('span','继续学习','eyebrow'),el('h2',compact?l.name:c.title),el('p',(compact?'':l.name+' · ')+progressLabel(c,l),'muted'));const bar=progressBar(c,l);if(bar)info.append(bar);const btn=el('button','继续播放 ↗','primary');btn.onclick=()=>play(c,l,true);panel.append(info,btn);return panel}
function lastLesson(c){try{const last=JSON.parse(localStorage.getItem('last_played')||'null');return last?.course_folder===c.folder?c.lessons.find(l=>l.name===last.lesson_name):null}catch{return null}}
function showLibrary(){course=null;lesson=null;video.pause();document.body.classList.remove('studying');$('player').classList.add('hidden');$('library').classList.remove('hidden');$('library').replaceChildren(el('div','本地课程','eyebrow'),el('h1','回到课堂'));for(const c of state.courses){const l=lastLesson(c);if(l){$('library').append(resumePanel(c,l));break}}const heading=el('div',undefined,'section-heading');heading.append(el('h2','全部课程'),el('span',state.courses.length+' 门','muted'));$('library').append(heading);const grid=el('div',undefined,'course-grid');for(const c of state.courses){const b=el('button',undefined,'course'),info=el('div');info.append(el('h2',c.title),el('span',c.lessons.length+' 节本地录像'+(c.staged?' · 待转存':''),'muted'));const l=lastLesson(c);b.append(info,el('span',l?l.name+' · '+progressLabel(c,l):'浏览课程','course-status'),el('span','↗','row-arrow'));b.onclick=()=>showCourse(c);grid.append(b)}$('library').append(grid);if(!state.courses.length)$('library').append(el('div','还没有课程录像。在“管理课程”中检查并下载。','empty'))}
function showCourse(c){course=c;lesson=null;video.pause();document.body.classList.remove('studying');$('player').classList.add('hidden');$('library').classList.remove('hidden');const back=el('button','← 课程库','back');back.onclick=showLibrary;$('library').replaceChildren(back,el('h1',c.title),el('p',c.lessons.length+' 节本地录像','muted'));const recent=lastLesson(c);if(recent)$('library').append(resumePanel(c,recent,true));const heading=el('div',undefined,'section-heading');heading.append(el('h2','课程内容'));$('library').append(heading);const list=el('div',undefined,'lesson-list');for(const l of c.lessons){const b=el('button',undefined,'lesson'),info=el('div',undefined,'lesson-info');info.append(el('b',l.name),el('span',[l.date,l.subtitle?'字幕已同步':'字幕待同步'].filter(Boolean).join(' · '),'muted'));const bar=progressBar(c,l);if(bar)info.append(bar);b.append(info,el('span',progressLabel(c,l),'lesson-progress'),el('span',progress(c,l)>0?'继续 →':'播放 →','row-action'));b.onclick=()=>play(c,l,true);list.append(b)}$('library').append(list)}
function setFocusMode(focus){const v=$('viewer-grid');v.classList.toggle('focus-slide',focus);$('toggle-focus-tb').textContent=focus?'视频优先':'课件优先';$('toggle-focus-tb').setAttribute('aria-pressed',focus);localStorage.setItem('slide_focus',focus?'1':'0')}
$('toggle-focus-tb').onclick=()=>setFocusMode(!$('viewer-grid').classList.contains('focus-slide'));
$('slide-wrap').onclick=()=>setFocusMode(!$('viewer-grid').classList.contains('focus-slide'));
function openLightbox(){if(!$('slide').getAttribute('src'))return;$('lightbox-img').src=$('slide').src;$('lightbox-caption').textContent=$('slide-caption').textContent;$('lightbox-sub-text').textContent=$('slide-sub-text').textContent;$('slide-lightbox').showModal()}
function closeLightbox(){$('slide-lightbox').close()}
$('zoom-slide').onclick=openLightbox;$('close-lightbox').onclick=closeLightbox;
$('lightbox-pip').onclick=async()=>{try{if(video.readyState>0&&!document.pictureInPictureElement)await video.requestPictureInPicture()}catch(e){}};
async function play(c,l,autoStart=false){lesson=l;course=c;document.body.classList.add('studying');document.querySelectorAll('.menu').forEach(x=>x.open=false);$('library').classList.add('hidden');$('player').classList.remove('hidden');$('lesson-title').textContent=l.name;$('course-title').textContent=c.title;localStorage.setItem('last_played',JSON.stringify({course_folder:c.folder,lesson_name:l.name,time:Date.now()}));const idx=c.lessons.findIndex(x=>x.name===l.name);$('prev-lesson').disabled=(idx<=0);$('next-lesson').disabled=(idx<0||idx>=c.lessons.length-1);$('prev-lesson').onclick=()=>{if(idx>0)play(c,c.lessons[idx-1],true)};$('next-lesson').onclick=()=>{if(idx>=0&&idx<c.lessons.length-1)play(c,c.lessons[idx+1],true)};video.replaceChildren();video.src=media(c,l.video);pages=[];cueRows=[];pageRows=[];originalCues=[];activeCue=-1;$('cues').replaceChildren();$('pages').replaceChildren();$('slide').removeAttribute('src');$('slide-caption').textContent='暂无课件';$('slide-sub-text').textContent='';const key=c.folder+'/'+l.name;const savedPosition=progress(c,l);$('offset').value=localStorage.getItem('offset/'+key)||0;const savedSpeed=localStorage.getItem('playback_speed')||'1';$('speed').value=savedSpeed;video.playbackRate=Number(savedSpeed)||1.0;setFocusMode(localStorage.getItem('slide_focus')==='1');video.onloadedmetadata=()=>{if(Number.isFinite(video.duration))localStorage.setItem('duration/'+key,video.duration);const t=savedPosition;if(t>0&&t<video.duration-5)video.currentTime=t;if(autoStart)video.play().catch(()=>{})};if(l.subtitle){const tr=document.createElement('track');tr.kind='subtitles';tr.srclang='zh';tr.label='中文字幕';tr.default=true;tr.src=media(c,l.name+'.vtt');tr.onload=()=>{tr.track.mode='showing';originalCues=Array.from(tr.track.cues||[]).map(q=>({cue:q,start:q.startTime,end:q.endTime}));for(const q of originalCues){const b=el('button',undefined,'cue');b.append(el('time',stamp(q.start)),el('span',q.cue.text));b.onclick=()=>video.currentTime=q.cue.startTime;cueRows.push(b);$('cues').append(b)}applyOffset()};video.append(tr)}else $('cues').append(el('p','字幕生成后，点击“同步字幕”即可补齐。','muted'));try{const r=await fetch(media(c,l.name+'.assets/timeline.json'));if(r.ok)pages=await r.json()}catch{}for(const p of pages){const b=el('button',undefined,'cue');b.append(el('time',stamp(p.time)),el('span','课件 '+(pageRows.length+1)));b.onclick=()=>{if(p.time<=video.duration)video.currentTime=p.time};pageRows.push(b);$('pages').append(b)}updateTime()}
function applyOffset(){const d=Number($('offset').value)||0;for(const q of originalCues){q.cue.startTime=Math.max(0,q.start+d);q.cue.endTime=Math.max(q.cue.startTime+.01,q.end+d)}localStorage.setItem('offset/'+course.folder+'/'+lesson.name,d)}$('offset').onchange=applyOffset;
function updateTime(){if(!lesson)return;const t=video.currentTime;$('session-clock').textContent=stamp(t)+' / '+(Number.isFinite(video.duration)?stamp(video.duration):'—');if(video.readyState>=1)localStorage.setItem('progress/'+course.folder+'/'+lesson.name,t);let p=-1;pages.forEach((q,i)=>{if(q.time<=t)p=i});pageRows.forEach((r,i)=>r.classList.toggle('active',i===p));if(p>=0){const src=media(course,lesson.name+'.assets/'+pages[p].file);if($('slide').getAttribute('src')!==src){$('slide').src=src;if($('slide-lightbox').open)$('lightbox-img').src=src}$('slide-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time);if($('slide-lightbox').open)$('lightbox-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time)}else{$('slide').removeAttribute('src');$('slide-caption').textContent='此时间暂无课件';if($('slide-lightbox').open){$('lightbox-img').removeAttribute('src');$('lightbox-caption').textContent='此时间暂无课件'}}const ci=originalCues.findIndex(q=>t>=q.cue.startTime&&t<q.cue.endTime);if(ci!==activeCue){cueRows.forEach((r,i)=>r.classList.toggle('active',i===ci));activeCue=ci;if(ci>=0){const row=cueRows[ci],list=$('cues');if(row.offsetTop<list.scrollTop||row.offsetTop+row.offsetHeight>list.scrollTop+list.clientHeight)list.scrollTop=row.offsetTop-list.clientHeight/2;const txt=originalCues[ci].cue.text;$('slide-sub-text').textContent=txt;if($('slide-lightbox').open)$('lightbox-sub-text').textContent=txt}else{$('slide-sub-text').textContent='';if($('slide-lightbox').open)$('lightbox-sub-text').textContent=''}}}video.ontimeupdate=updateTime;
$('return').onclick=()=>showCourse(course);$('transcript-tab').onclick=()=>tab(true);$('slides-tab').onclick=()=>tab(false);function tab(sub){$('cues').classList.toggle('hidden',!sub);$('pages').classList.toggle('hidden',sub);$('transcript-tab').setAttribute('aria-selected',sub);$('slides-tab').setAttribute('aria-selected',!sub)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Course-Token':state.token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}async function run(command){try{await post('/api/run',{command});$('notice').textContent='任务已开始，完成后课程库会自动刷新。'}catch(e){$('notice').textContent=e.message}}$('download').onclick=()=>run('download');$('transfer').onclick=()=>run('transfer');$('sync').onclick=()=>run('subtitles');$('settings').onclick=()=>{for(const k of ['destination','fallback','transfer_time'])$('form').elements[k].value=state.settings[k];$('form').elements.courses.value=state.settings.courses.join(',');$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=async e=>{e.preventDefault();try{await post('/api/settings',Object.fromEntries(new FormData(e.target)));e.target.elements.password.value='';$('dialog').close();await refresh(!$('player').classList.contains('hidden')?false:true)}catch(err){$('notice').textContent=err.message;$('dialog').close()}};refresh();setInterval(()=>refresh($('player').classList.contains('hidden')&&!course),15000);
$('speed').onchange=()=>{const sp=Number($('speed').value)||1.0;video.playbackRate=sp;localStorage.setItem('playback_speed',String(sp))};
$('autoplay').checked=localStorage.getItem('autoplay_next')!=='0';
$('autoplay').onchange=()=>localStorage.setItem('autoplay_next',$('autoplay').checked?'1':'0');
video.onended=()=>{if($('autoplay').checked&&course&&lesson){const idx=course.lessons.findIndex(x=>x.name===lesson.name);if(idx>=0&&idx<course.lessons.length-1){const nextL=course.lessons[idx+1];$('notice').textContent='本节已播完，自动连播下一节：'+nextL.name;play(course,nextL,true)}else{$('notice').textContent='本课程录像已全部播放完毕。'}}};
$('pip-btn').onclick=async()=>{try{if(document.pictureInPictureElement){await document.exitPictureInPicture()}else if(video.readyState>0){await video.requestPictureInPicture()}}catch(e){console.warn(e)}};
window.addEventListener('keydown',e=>{if(!lesson||$('dialog').open||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}else if(e.code==='ArrowLeft'){e.preventDefault();video.currentTime=Math.max(0,video.currentTime-5)}else if(e.code==='ArrowRight'){e.preventDefault();video.currentTime=Math.min(video.duration||0,video.currentTime+5)}else if(e.code==='ArrowUp'){e.preventDefault();video.volume=Math.min(1,video.volume+0.1)}else if(e.code==='ArrowDown'){e.preventDefault();video.volume=Math.max(0,video.volume-0.1)}else if(e.code==='KeyF'){e.preventDefault();if(document.fullscreenElement){document.exitFullscreen()}else{(video.requestFullscreen?video.requestFullscreen():$('player').requestFullscreen()).catch(()=>{})}}else if(e.code==='KeyM'){e.preventDefault();video.muted=!video.muted}else if(e.code==='KeyP'){e.preventDefault();$('pip-btn').click()}else if(e.code==='KeyS'){e.preventDefault();setFocusMode(!$('viewer-grid').classList.contains('focus-slide'))}else if(e.code==='KeyZ'){e.preventDefault();$('slide-lightbox').open?closeLightbox():openLightbox()}else if(e.code==='Escape'&&$('slide-lightbox').open){e.preventDefault();closeLightbox()}else if(e.code==='BracketLeft'){e.preventDefault();$('prev-lesson').click()}else if(e.code==='BracketRight'){e.preventDefault();$('next-lesson').click()}});
</script></body></html>
