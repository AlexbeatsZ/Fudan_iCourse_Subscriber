<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程库</title>
<style>
:root{color-scheme:light;--ink:#173442;--muted:#637982;--paper:#f3f7f9;--line:#d5e2e8;--accent:#147a91;--wash:#e5f3f7;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px "Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:var(--white);color:var(--ink)}button:hover{border-color:var(--accent);background:var(--wash)}button:focus-visible,input:focus-visible{outline:3px solid #65bbd1;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;padding:22px 4vw;border-bottom:1px solid var(--line);background:#fff}header strong{font-size:23px;letter-spacing:2px}header nav{display:flex;gap:8px}.brand{display:flex;align-items:center;gap:14px}.mark{width:32px;height:36px;border-left:5px solid var(--accent);border-right:2px solid var(--accent);background:repeating-linear-gradient(transparent 0 8px,#147a9130 8px 10px)}main{max-width:1500px;padding:30px 4vw;margin:auto}h1{font-size:32px;font-weight:600;letter-spacing:1px;margin:0 0 9px}h2{font-size:20px;font-weight:600}.muted{color:var(--muted)}#notice{padding:12px 0;min-height:42px}.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:25px}.course{display:block;text-align:left;min-height:160px;padding:24px;border-left:5px solid var(--accent);box-shadow:0 4px 20px #17344205}.course h2{line-height:1.6;margin:0 0 20px}.badge{display:inline-block;background:var(--wash);padding:3px 8px;border-radius:4px;font-size:12px;color:var(--accent)}.lesson-list{display:grid;gap:9px;margin-top:22px}.lesson{display:flex;align-items:center;gap:22px;text-align:left;padding:18px 22px}.lesson b{font-family:"Cascadia Mono",Consolas,monospace;font-size:19px;white-space:nowrap}.lesson .date{margin-left:auto;color:var(--muted)}.back{margin-bottom:20px}.viewer{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:22px;margin-top:24px}.screen{background:#10242d;border-radius:9px;overflow:hidden}video{width:100%;display:block;max-height:68vh}.toolbar{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:0 0 9px 9px}.toolbar input{width:68px;padding:5px}.slide{background:white;border:1px solid var(--line);border-radius:9px;padding:15px;min-height:220px;display:grid;place-items:center}.slide img{max-width:100%;max-height:53vh;object-fit:contain}.slide figcaption{margin-top:9px;color:var(--muted)}.tabs{display:flex;gap:8px;margin:16px 0 12px}.tabs button[aria-selected=true]{background:var(--accent);color:white}.timeline{max-height:270px;overflow:auto;display:grid;gap:5px}.cue{padding:10px 12px;text-align:left;display:flex;gap:13px;border:0;background:transparent;line-height:1.6}.cue.active{background:var(--wash);color:#086a82}.cue time{font:12px "Cascadia Mono",Consolas,monospace;padding-top:4px;color:var(--muted);min-width:50px}.empty{padding:55px 20px;border:1px dashed var(--line);border-radius:10px;margin-top:25px;line-height:1.8}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;width:min(580px,90vw);color:var(--ink)}dialog::backdrop{background:#10242d66}form{display:grid;gap:12px}label{display:grid;gap:7px}input{border:1px solid var(--line);padding:10px;border-radius:6px;width:100%}.actions{display:flex;gap:10px;justify-content:flex-end}.primary{background:var(--accent);color:white}.hidden{display:none!important}@media(max-width:850px){.viewer{grid-template-columns:1fr}header{flex-wrap:wrap;gap:15px}header nav{flex-wrap:wrap}.lesson{gap:10px}.lesson .date{font-size:12px}h1{font-size:26px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true"></span><strong>课程库</strong></div><nav><button id="download">检查并下载</button><button id="transfer">立即转存</button><button id="sync">同步字幕</button><button id="settings">设置</button></nav></header>
<main><div id="notice" role="status" class="muted"></div><section id="library"></section><section id="player" class="hidden"><button class="back" id="return">← 返回课次</button><h1 id="lesson-title"></h1><div class="muted" id="course-title"></div><div class="viewer"><div><div class="screen"><video id="video" controls preload="metadata"></video></div><div class="toolbar"><label style="display:flex;align-items:center;gap:6px">倍速 <select id="speed" style="padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:#fff"><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2.0x</option></select></label><label style="display:flex;align-items:center;gap:6px">字幕偏移 <input id="offset" type="number" value="0" step="0.5" aria-label="字幕偏移秒数"> 秒</label><span class="muted">正数延后</span><span class="muted" style="margin-left:auto;font-size:12px">快捷键: 空格 播放/暂停 · ← / → 快退/快进5秒</span></div><div class="tabs"><button id="transcript-tab" aria-selected="true">字幕</button><button id="slides-tab" aria-selected="false">课件目录</button></div><div id="cues" class="timeline"></div><div id="pages" class="timeline hidden"></div></div><figure class="slide"><img id="slide" alt="当前课件"><figcaption id="slide-caption">暂无课件</figcaption></figure></div></section></main>
<dialog id="dialog"><form id="form"><h2>课程库设置</h2><label>视频目录<input name="destination" required></label><label>网络盘不可用时暂存到<input name="fallback" required></label><label>订阅课程编号或链接（逗号分隔）<input name="courses" required></label><label>每天自动转存时间<input name="transfer_time" type="time" required></label><details><summary>复旦账号环境变量</summary><p class="muted">保存为 FUDAN_STUID、FUDAN_UISPSW。以后也可直接在 Windows 环境变量中修改。</p><label>学号<input name="account" autocomplete="off"></label><label>密码（留空不修改）<input name="password" type="password" autocomplete="new-password"></label></details><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);let state,course,lesson,pages=[],cueRows=[],pageRows=[],originalCues=[],activeCue=-1;const video=$('video');
const stamp=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function media(c,file){return '/media/'+c.root+'/'+encodeURIComponent(c.folder)+'/'+file.split('/').map(encodeURIComponent).join('/')}
async function refresh(show=true){state=await(await fetch('/api/library')).json();if(show)showLibrary();$('notice').textContent=state.running?'正在处理，已下载的视频可直接观看。':state.last.errors?.length?'上次任务有未完成项目，点击检查并下载可重试。':state.last.error?'上次任务未完成，请检查网络和环境变量。':state.courses?.length?'本地课程库已就绪（已发现 '+state.courses.length+' 门课程），点击课程即可观看。':!state.configured?'请先在设置中保存复旦账号，或设置 FUDAN_STUID / FUDAN_UISPSW。':'视频目录暂无课程录像。'}
function showLibrary(){course=null;lesson=null;video.pause();$('player').classList.add('hidden');$('library').classList.remove('hidden');$('library').replaceChildren(el('h1','我的课程'),el('p','按课程选择录像，继续上次的学习。','muted'));const grid=el('div',undefined,'course-grid');for(const c of state.courses){const b=el('button',undefined,'course');b.append(el('h2',c.title),el('span',c.lessons.length+' 节录像','muted'));if(c.staged)b.append(el('span','下载文件夹 · 待转存','badge'));b.onclick=()=>showCourse(c);grid.append(b)}$('library').append(grid);if(!state.courses.length)$('library').append(el('div','这里还没有课程录像。点击“检查并下载”，课程会按文件夹自动出现在这里。','empty'))}
function showCourse(c){course=c;video.pause();$('player').classList.add('hidden');$('library').classList.remove('hidden');const back=el('button','← 所有课程','back');back.onclick=showLibrary;$('library').replaceChildren(back,el('h1',c.title));const list=el('div',undefined,'lesson-list');for(const l of c.lessons){const b=el('button',undefined,'lesson');b.append(el('b',l.name),el('span',l.subtitle?'字幕已就绪':'字幕待同步','badge'),el('span',l.date||'','date'));b.onclick=()=>play(c,l);list.append(b)}$('library').append(list)}
async function play(c,l){lesson=l;course=c;$('library').classList.add('hidden');$('player').classList.remove('hidden');$('lesson-title').textContent=l.name;$('course-title').textContent=c.title;video.replaceChildren();video.src=media(c,l.video);pages=[];cueRows=[];pageRows=[];originalCues=[];activeCue=-1;$('cues').replaceChildren();$('pages').replaceChildren();$('slide').removeAttribute('src');$('slide-caption').textContent='暂无课件';const key=c.folder+'/'+l.name;$('offset').value=localStorage.getItem('offset/'+key)||0;video.onloadedmetadata=()=>{const t=Number(localStorage.getItem('progress/'+key)||0);if(t>0&&t<video.duration-5)video.currentTime=t};if(l.subtitle){const tr=document.createElement('track');tr.kind='subtitles';tr.srclang='zh';tr.label='中文字幕';tr.default=true;tr.src=media(c,l.name+'.vtt');tr.onload=()=>{tr.track.mode='showing';originalCues=Array.from(tr.track.cues||[]).map(q=>({cue:q,start:q.startTime,end:q.endTime}));for(const q of originalCues){const b=el('button',undefined,'cue');b.append(el('time',stamp(q.start)),el('span',q.cue.text));b.onclick=()=>video.currentTime=q.cue.startTime;cueRows.push(b);$('cues').append(b)}applyOffset()};video.append(tr)}else $('cues').append(el('p','字幕生成后，点击“同步字幕”即可补齐。','muted'));try{const r=await fetch(media(c,l.name+'.assets/timeline.json'));if(r.ok)pages=await r.json()}catch{}for(const p of pages){const b=el('button',undefined,'cue');b.append(el('time',stamp(p.time)),el('span','课件 '+(pageRows.length+1)));b.onclick=()=>{if(p.time<=video.duration)video.currentTime=p.time};pageRows.push(b);$('pages').append(b)}updateTime()}
function applyOffset(){const d=Number($('offset').value)||0;for(const q of originalCues){q.cue.startTime=Math.max(0,q.start+d);q.cue.endTime=Math.max(q.cue.startTime+.01,q.end+d)}localStorage.setItem('offset/'+course.folder+'/'+lesson.name,d)}$('offset').onchange=applyOffset;
function updateTime(){if(!lesson)return;const t=video.currentTime;localStorage.setItem('progress/'+course.folder+'/'+lesson.name,t);let p=-1;pages.forEach((q,i)=>{if(q.time<=t)p=i});pageRows.forEach((r,i)=>r.classList.toggle('active',i===p));if(p>=0){const src=media(course,lesson.name+'.assets/'+pages[p].file);if($('slide').getAttribute('src')!==src)$('slide').src=src;$('slide-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time)}else{$('slide').removeAttribute('src');$('slide-caption').textContent='此时间暂无课件'}const ci=originalCues.findIndex(q=>t>=q.cue.startTime&&t<q.cue.endTime);if(ci!==activeCue){cueRows.forEach((r,i)=>r.classList.toggle('active',i===ci));activeCue=ci;if(ci>=0)cueRows[ci].scrollIntoView({block:'nearest'})}}video.ontimeupdate=updateTime;
$('return').onclick=()=>showCourse(course);$('transcript-tab').onclick=()=>tab(true);$('slides-tab').onclick=()=>tab(false);function tab(sub){$('cues').classList.toggle('hidden',!sub);$('pages').classList.toggle('hidden',sub);$('transcript-tab').setAttribute('aria-selected',sub);$('slides-tab').setAttribute('aria-selected',!sub)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Course-Token':state.token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}async function run(command){try{await post('/api/run',{command});$('notice').textContent='任务已开始，完成后课程库会自动刷新。'}catch(e){$('notice').textContent=e.message}}$('download').onclick=()=>run('download');$('transfer').onclick=()=>run('transfer');$('sync').onclick=()=>run('subtitles');$('settings').onclick=()=>{for(const k of ['destination','fallback','transfer_time'])$('form').elements[k].value=state.settings[k];$('form').elements.courses.value=state.settings.courses.join(',');$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=async e=>{e.preventDefault();try{await post('/api/settings',Object.fromEntries(new FormData(e.target)));e.target.elements.password.value='';$('dialog').close();await refresh(!$('player').classList.contains('hidden')?false:true)}catch(err){$('notice').textContent=err.message;$('dialog').close()}};refresh();setInterval(()=>refresh($('player').classList.contains('hidden')&&!course),15000);
$('speed').onchange=()=>{video.playbackRate=Number($('speed').value)||1.0};
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}else if(e.code==='ArrowLeft'){e.preventDefault();video.currentTime=Math.max(0,video.currentTime-5)}else if(e.code==='ArrowRight'){e.preventDefault();video.currentTime=Math.min(video.duration||0,video.currentTime+5)}});
</script></body></html>
