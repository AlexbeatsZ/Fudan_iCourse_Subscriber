<script>
const $=id=>document.getElementById(id);let state,course,lesson,pages=[],cueRows=[],pageRows=[],originalCues=[],activeCue=-1;const video=$('video');
try{$('theme').value=localStorage.getItem('icourse_theme')||'system'}catch{}$('theme').onchange=()=>{const value=$('theme').value;if(value==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=value;try{localStorage.setItem('icourse_theme',value)}catch{}};
const stamp=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function media(c,file){return '/media/'+c.root+'/'+encodeURIComponent(c.folder)+'/'+file.split('/').map(encodeURIComponent).join('/')}
async function refresh(show=true){state=await(await fetch('/api/library')).json();if(show)showLibrary();$('notice').textContent=state.running?'正在处理，已下载的视频可直接观看。':state.last.errors?.length?'上次任务有未完成项目，点击检查并下载可重试。':state.last.error?'上次任务未完成，请检查网络和环境变量。':state.courses?.length?'':!state.configured?'请先在设置中保存复旦账号，或设置 FUDAN_STUID / FUDAN_UISPSW。':'视频目录暂无课程录像。'}
function progress(c,l){return Math.max(0,Number(localStorage.getItem('progress/'+c.folder+'/'+l.name))||0)}
function duration(c,l){return Number(localStorage.getItem('duration/'+c.folder+'/'+l.name))||0}

function resumePanel(c,l,compact=false){const panel=el('div',undefined,'resume-card'),info=el('div',undefined,'resume-info');info.append(el('span','继续学习','eyebrow'),el('h2',compact?l.name:c.title),el('p',(compact?'':l.name+' · ')+progressLabel(c,l),'muted'));const bar=progressBar(c,l);if(bar)info.append(bar);const btn=el('button','继续播放 ↗','primary');btn.onclick=()=>play(c,l,true);panel.append(info,btn);return panel}
function lastLesson(c){try{const last=JSON.parse(localStorage.getItem('last_played')||'null');return last?.course_folder===c.folder?c.lessons.find(l=>l.name===last.lesson_name):null}catch{return null}}

function stopViewing(){if(lesson&&video.readyState>=1)updateTime();video.pause();lesson=null;document.body.classList.remove('studying');$('player').classList.add('hidden');$('library').classList.remove('hidden')}
function showLibrary(){stopViewing();course=null;const root=$('library');root.replaceChildren();const total=state.courses.reduce((n,c)=>n+c.lessons.length,0),hero=el('div',undefined,'library-hero'),copy=el('div',undefined,'hero-copy');copy.append(el('div','LECTURE ARCHIVE / 课程回放','eyebrow'));const title=el('h1');title.append(el('span','课堂，'),el('span','随时回到。'));copy.append(title,el('p','从上次停下的地方继续。视频、课件与逐句字幕，在同一张书桌上。'));const meta=el('div',undefined,'hero-meta');for(const [n,label] of [[state.courses.length,'门课程'],[total,'节录像']]){const item=el('span');item.append(el('b',String(n)),document.createTextNode(label));meta.append(item)}meta.append(el('span','LOCAL / 本地收藏'));copy.append(meta);hero.append(copy);let featuredCourse=state.courses.find(c=>lastLesson(c))||state.courses[0];if(featuredCourse){const c=featuredCourse,l=lastLesson(c)||c.lessons[0],feature=el('button',undefined,'feature'),visual=el('div',undefined,'feature-visual');visual.append(preview(c,l,''),el('span',lastLesson(c)?'CONTINUE / 继续学习':'IN THE LIBRARY / 课堂精选','feature-flag'),el('span','▶','feature-play'));const caption=el('div',undefined,'feature-caption'),info=el('div');info.append(el('h2',c.title),el('p',l.name+' / '+progressLabel(c,l)));caption.append(info,el('span','↗'));feature.append(visual,caption);feature.onclick=()=>play(c,l,true);hero.append(feature)}root.append(hero);const heading=el('div',undefined,'archive-heading'),headingText=el('div');headingText.append(el('div','YOUR COLLECTION / 课程索引','eyebrow'),el('h2','课程库'));const tools=el('div',undefined,'library-tools'),searchLabel=el('label',undefined,'search-box'),search=el('input');search.type='search';search.id='library-search';search.placeholder='搜索课程或课次';search.setAttribute('aria-label','搜索课程或课次');search.value=libraryQuery;searchLabel.append(el('span','⌕'),search);const sort=el('select');sort.setAttribute('aria-label','课程排序');for(const [value,label] of [['title','按课程名称'],['lessons','按录像数量']]){const o=el('option',label);o.value=value;sort.append(o)}sort.value=librarySort;tools.append(searchLabel,sort);heading.append(headingText,tools);root.append(heading);const layout=el('div',undefined,'archive-layout'),aside=el('nav',undefined,'collection-list');aside.setAttribute('aria-label','筛选课程');aside.append(el('div','COLLECTIONS','eyebrow'));for(const [value,label,count] of [['all','全部课程',state.courses.length],['started','已开始学习',state.courses.filter(c=>c.lessons.some(l=>progress(c,l)>0)).length],['subtitles','有字幕的课程',state.courses.filter(c=>c.lessons.some(l=>l.subtitle)).length]]){const b=el('button',undefined,'collection-button');b.dataset.filter=value;b.setAttribute('aria-pressed',libraryFilter===value);b.append(el('span',label),el('small',String(count)));b.onclick=()=>{libraryFilter=value;renderCourses()};aside.append(b)}const grid=el('div',undefined,'course-grid');grid.id='course-grid';layout.append(aside,grid);root.append(layout);const footer=el('footer',undefined,'library-footer');footer.append(el('span','iCourse / 视频 · 课件 · 字幕'),el('span',state.settings.destination));root.append(footer);search.oninput=()=>{libraryQuery=search.value;renderCourses()};sort.onchange=()=>{librarySort=sort.value;renderCourses()};renderCourses()}
function renderCourses(){const grid=$('course-grid');if(!grid)return;grid.replaceChildren();document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===libraryFilter));const q=libraryQuery.trim().toLocaleLowerCase();let courses=state.courses.filter(c=>(!q||(c.title+' '+c.lessons.map(l=>l.name+' '+(l.date||'')).join(' ')).toLocaleLowerCase().includes(q))&&(libraryFilter!=='started'||c.lessons.some(l=>progress(c,l)>0))&&(libraryFilter!=='subtitles'||c.lessons.some(l=>l.subtitle)));courses.sort((a,b)=>librarySort==='lessons'?b.lessons.length-a.lessons.length:a.title.localeCompare(b.title,'zh'));for(const c of courses){const l=lastLesson(c)||c.lessons[0],b=el('button',undefined,'course'),image=el('div',undefined,'course-image');image.append(preview(c,l,''),el('span',c.lessons.length+' 节录像','course-count'));const info=el('div',undefined,'course-copy');info.append(el('h2',c.title),el('span',c.lessons.filter(l=>l.subtitle).length+' 节含字幕'+(c.staged?' · 待转存':''),'muted'));const foot=el('div',undefined,'course-foot');foot.append(el('span',lastLesson(c)?l.name+' · '+progressLabel(c,l):'查看课程内容'),el('span','↗','row-arrow'));info.append(foot);b.append(image,info);b.onclick=()=>showCourse(c);grid.append(b)}if(!courses.length)grid.append(el('p',state.courses.length?'没有匹配的课程。试试其他关键词或“全部课程”。':'还没有课程录像。在“管理课程”中检查并下载。','empty'))}
function showCourse(c){stopViewing();course=c;const back=el('button','← 全部课程','back');back.onclick=showLibrary;const intro=el('div',undefined,'course-intro');intro.append(back,el('h1',c.title),el('p',c.lessons.length+' 节本地录像 / 视频、课件与字幕','muted'));$('library').replaceChildren(intro);const recent=lastLesson(c);if(recent)$('library').append(resumePanel(c,recent,true));const heading=el('div',undefined,'section-heading');heading.append(el('h2','LECTURES / 课程内容'));$('library').append(heading);const list=el('div',undefined,'lesson-list');for(const l of c.lessons){const b=el('button',undefined,'lesson'),info=el('div',undefined,'lesson-info');info.append(el('b',l.name),el('span',[l.date,l.subtitle?'字幕已同步':'字幕待同步'].filter(Boolean).join(' · '),'muted'));const bar=progressBar(c,l);if(bar)info.append(bar);b.append(preview(c,l,'lesson-preview'),info,el('span',progressLabel(c,l),'lesson-progress'),el('span',progress(c,l)>0?'继续 →':'播放 →','row-action'));b.onclick=()=>play(c,l,true);list.append(b)}$('library').append(list)}
$('home').onclick=()=>state&&showLibrary();
let alignmentMode=localStorage.getItem('projection_alignment')||'video';
function alignSurfaces(){const grid=$('viewer-grid'),img=$('slide'),screen=video.parentElement;const useVideo=alignmentMode==='video';const ratio=useVideo?(video.videoWidth/video.videoHeight):(img.naturalWidth/img.naturalHeight);const width=useVideo?screen.clientWidth:Math.max(0,$('slide-wrap').clientWidth-32);grid.classList.toggle('aligned',Number.isFinite(ratio)&&ratio>0);if(Number.isFinite(ratio)&&ratio>0)grid.style.setProperty('--aligned-height',Math.round(Math.min(width/ratio,window.innerHeight*.58))+'px');$('align-to-video').setAttribute('aria-pressed',useVideo);$('align-to-slide').setAttribute('aria-pressed',!useVideo)}
for(const [id,mode] of [['align-to-video','video'],['align-to-slide','slide']])$(id).onclick=()=>{alignmentMode=mode;localStorage.setItem('projection_alignment',mode);alignSurfaces()};
new ResizeObserver(()=>alignSurfaces()).observe($('viewer-grid'));
$('slide').addEventListener('load',alignSurfaces);video.addEventListener('loadedmetadata',alignSurfaces);
window.addEventListener('resize',alignSurfaces);
function setFocusMode(focus){const v=$('viewer-grid');v.classList.toggle('focus-slide',focus);$('toggle-focus-tb').textContent=focus?'视频优先':'课件优先';$('toggle-focus-tb').setAttribute('aria-pressed',focus);localStorage.setItem('slide_focus',focus?'1':'0');alignSurfaces()}
$('toggle-focus-tb').onclick=()=>setFocusMode(!$('viewer-grid').classList.contains('focus-slide'));
$('slide-wrap').onclick=()=>setFocusMode(!$('viewer-grid').classList.contains('focus-slide'));
function openLightbox(){if(!$('slide').getAttribute('src'))return;$('lightbox-img').src=$('slide').src;$('lightbox-caption').textContent=$('slide-caption').textContent;$('lightbox-sub-text').textContent=$('slide-sub-text').textContent;$('slide-lightbox').showModal()}
function closeLightbox(){$('slide-lightbox').close()}
$('zoom-slide').onclick=openLightbox;$('close-lightbox').onclick=closeLightbox;
$('lightbox-pip').onclick=async()=>{try{if(video.readyState>0&&!document.pictureInPictureElement)await video.requestPictureInPicture()}catch(e){}};
async function play(c,l,autoStart=false){if(lesson&&video.readyState>=1)updateTime();video.pause();lesson=l;course=c;document.body.classList.add('studying');document.querySelectorAll('.menu').forEach(x=>x.open=false);$('library').classList.add('hidden');$('player').classList.remove('hidden');$('lesson-title').textContent=l.name;$('course-title').textContent=c.title;localStorage.setItem('last_played',JSON.stringify({course_folder:c.folder,lesson_name:l.name,time:Date.now()}));const idx=c.lessons.findIndex(x=>x.name===l.name);$('prev-lesson').disabled=(idx<=0);$('next-lesson').disabled=(idx<0||idx>=c.lessons.length-1);$('prev-lesson').onclick=()=>{if(idx>0)play(c,c.lessons[idx-1],true)};$('next-lesson').onclick=()=>{if(idx>=0&&idx<c.lessons.length-1)play(c,c.lessons[idx+1],true)};video.replaceChildren();video.src=media(c,l.video);pages=[];cueRows=[];pageRows=[];originalCues=[];activeCue=-1;$('cues').replaceChildren();$('pages').replaceChildren();$('slide').removeAttribute('src');$('slide-caption').textContent='暂无课件';$('slide-sub-text').textContent='';const key=c.folder+'/'+l.name;const savedPosition=progress(c,l);$('offset').value=localStorage.getItem('offset/'+key)||0;const savedSpeed=localStorage.getItem('playback_speed')||'1';$('speed').value=savedSpeed;video.playbackRate=Number(savedSpeed)||1.0;setFocusMode(localStorage.getItem('slide_focus')==='1');video.onloadedmetadata=()=>{updatePageButtons();if(Number.isFinite(video.duration))localStorage.setItem('duration/'+key,video.duration);const t=savedPosition;if(t>0&&t<video.duration-5)video.currentTime=t;if(autoStart)video.play().catch(()=>{})};if(l.subtitle){const tr=document.createElement('track');tr.kind='subtitles';tr.srclang='zh';tr.label='中文字幕';tr.default=true;tr.src=media(c,l.name+'.vtt');tr.onload=()=>{tr.track.mode='showing';originalCues=Array.from(tr.track.cues||[]).map(q=>({cue:q,start:q.startTime,end:q.endTime}));for(const q of originalCues){const b=el('button',undefined,'cue');b.append(el('time',stamp(q.s function applyOffset(){const d=Number($('offset').value)||0;for(const q of originalCues){q.cue.startTime=Math.max(0,q.start+d);q.cue.endTime=Math.max(q.cue.startTime+.01,q.end+d)}localStorage.setItem('offset/'+course.folder+'/'+lesson.name,d)}$('offset').onchange=applyOffset;
function currentPage(){let i=-1;pages.forEach((p,n)=>{if(p.time<=video.currentTime)i=n});return i}
function canSeekPage(i){return video.readyState>=1&&i>=0&&i<pages.length&&pages[i].time<=video.duration}
function updatePageButtons(){const i=currentPage();for(const prefix of ['slide','lightbox']){ $(prefix+'-prev').disabled=!canSeekPage(i-1);$(prefix+'-next').disabled=!canSeekPage(i+1)}}
function turnPage(step){const i=currentPage()+step;if(canSeekPage(i)){video.currentTime=pages[i].time;updateTime()}}
for(const prefix of ['slide','lightbox']){for(const [direction,step] of [['prev',-1],['next',1]])$(prefix+'-'+direction).onclick=e=>{e.stopPropagation();turnPage(step)}}
function updateTime(){if(!lesson)return;updatePageButtons();const t=video.currentTime;$('session-clock').textContent=stamp(t)+' / '+(Number.isFinite(video.duration)?stamp(video.duration):'—');if(video.readyState>=1)localStorage.setItem('progress/'+course.folder+'/'+lesson.name,t);let p=-1;pages.forEach((q,i)=>{if(q.time<=t)p=i});pageRows.forEach((r,i)=>r.classList.toggle('active',i===p));if(p>=0){const src=media(course,lesson.name+'.assets/'+pages[p].file);if($('slide').getAttribute('src')!==src){$('slide').src=src;if($('slide-lightbox').open)$('lightbox-img').src=src}$('slide-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time);if($('slide-lightbox').open)$('lightbox-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time)}else{$('slide').removeAttribute('src');$('slide-caption').textContent='此时间暂无课件';if($('slide-lightbox').open){$('lightbox-img').removeAttribute('src');$('lightbox-caption').textContent='此时间暂无课件'}}const ci=originalCues.findIndex(q=>t>=q.cue.startTime&&t<q.cue.endTime);if(ci!==activeCue){cueRows.forEach((r,i)=>r.classList.toggle('active',i===ci));activeCue=ci;if(ci>=0){const row=cueRows[ci],list=$('cues');if(row.offsetTop<list.scrollTop||row.offsetTop+row.offsetHeight>list.scrollTop+list.clientHeight)list.scrollTop=row.offsetTop-list.clientHeight/2;const txt=originalCues[ci].cue.text;$('slide-sub-text').textContent=txt;if($('slide-lightbox').open)$('lightbox-sub-text').textContent=txt}else{$('slide-sub-text').textContent='';if($('slide-lightbox').open)$('lightbox-sub-text').textContent=''}}}video.ontimeupdate=updateTime;
$('return').onclick=()=>showCourse(course);$('transcript-tab').onclick=()=>tab(true);$('slides-tab').onclick=()=>tab(false);function tab(sub){$('cues').classList.toggle('hidden',!sub);$('pages').classList.toggle('hidden',sub);$('transcript-tab').setAttribute('aria-selected',sub);$('slides-tab').setAttribute('aria-selected',!sub)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Course-Token':state.token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}async function run(command){try{await post('/api/run',{command});$('notice').textContent='任务已开始，完成后课程库会自动刷新。'}catch(e){$('notice').textContent=e.message}}$('download').onclick=()=>run('download');$('transfer').onclick=()=>run('transfer');$('sync').onclick=()=>run('subtitles');$('settings').onclick=()=>{for(const k of ['repository','destination','fallback','transfer_time'])$('form').elements[k].value=state.settings[k];$('form').elements.courses.value=state.settings.courses.join(',');$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=async e=>{e.preventDefault();try{await post('/api/settings',Object.fromEntries(new FormData(e.target)));e.target.elements.password.value='';$('dialog').close();await refresh(!$('player').classList.contains('hidden')?false:true)}catch(err){$('notice').textContent=err.message;$('dialog').close()}};refresh();setInterval(()=>refresh($('player').classList.contains('hidden')&&!course&&document.activeElement?.id!=='library-search'),15000);
$('speed').onchange=()=>{const sp=Number($('speed').value)||1.0;video.playbackRate=sp;localStorage.setItem('playback_speed',String(sp))};
$('autoplay').checked=localStorage.getItem('autoplay_next')!=='0';
$('autoplay').onchange=()=>localStorage.setItem('autoplay_next',$('autoplay').checked?'1':'0');
video.onended=()=>{if($('autoplay').checked&&course&&lesson){const idx=course.lessons.findIndex(x=>x.name===lesson.name);if(idx>=0&&idx<course.lessons.length-1){const nextL=course.lessons[idx+1];$('notice').textContent='本节已播完，自动连播下一节：'+nextL.name;play(course,nextL,true)}else{$('notice').textContent='本课程录像已全部播放完毕。'}}};
$('pip-btn').onclick=async()=>{try{if(document.pictureInPictureElement){await document.exitPictureInPicture()}else if(video.readyState>0){await video.requestPictureInPicture()}}catch(e){console.warn(e)}};
window.addEventListener('keydown',e=>{if(!lesson||$('dialog').open||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}else if(e.code==='ArrowLeft'){e.preventDefault();video.currentTime=Math.max(0,video.currentTime-5)}else if(e.code==='ArrowRight'){e.preventDefault();video.currentTime=Math.min(video.duration||0,video.currentTime+5)}else if(e.code==='ArrowUp'){e.preventDefault();video.volume=Math.min(1,video.volume+0.1)}else if(e.code==='ArrowDown'){e.preventDefault();video.volume=Math.max(0,video.volume-0.1)}else if(e.code==='KeyF'){e.preventDefault();if(document.fullscreenElement){document.exitFullscreen()}else{(video.requestFullscreen?video.requestFullscreen():$('player').requestFullscreen()).catch(()=>{})}}else if(e.code==='KeyM'){e.preventDefault();video.muted=!video.muted}else if(e.code==='KeyP'){e.preventDefault();$('pip-btn').click()}else if(e.code==='KeyS'){e.preventDefault();setFocusMode(!$('viewer-grid').classList.contains('focus-slide'))}else if(e.code==='KeyZ'){e.preventDefault();$('slide-lightbox').open?closeLightbox():openLightbox()}else if(e.code==='Escape'&&$('slide-lightbox').open){e.preventDefault();closeLightbox()}else if(e.code==='BracketLeft'){e.preventDefault();$('prev-lesson').click()}else if(e.code==='BracketRight'){e.preventDefault();$('next-lesson').click()}});
</script></body></html>
