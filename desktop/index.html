<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程库</title>
<style>
:root{color-scheme:light;--ink:#173442;--muted:#637982;--paper:#f3f7f9;--line:#d5e2e8;--accent:#147a91;--wash:#e5f3f7;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px "Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:var(--white);color:var(--ink)}button:hover{border-color:var(--accent);background:var(--wash)}button:focus-visible,input:focus-visible{outline:3px solid #65bbd1;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;padding:22px 4vw;border-bottom:1px solid var(--line);background:#fff}header strong{font-size:23px;letter-spacing:2px}header nav{display:flex;gap:8px}.brand{display:flex;align-items:center;gap:14px}.mark{width:32px;height:36px;border-left:5px solid var(--accent);border-right:2px solid var(--accent);background:repeating-linear-gradient(transparent 0 8px,#147a9130 8px 10px)}main{max-width:1500px;padding:30px 4vw;margin:auto}h1{font-size:32px;font-weight:600;letter-spacing:1px;margin:0 0 9px}h2{font-size:20px;font-weight:600}.muted{color:var(--muted)}#notice{padding:12px 0;min-height:42px}.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:25px}.course{display:block;text-align:left;min-height:160px;padding:24px;border-left:5px solid var(--accent);box-shadow:0 4px 20px #17344205}.course h2{line-height:1.6;margin:0 0 20px}.badge{display:inline-block;background:var(--wash);padding:3px 8px;border-radius:4px;font-size:12px;color:var(--accent)}.lesson-list{display:grid;gap:9px;margin-top:22px}.lesson{display:flex;align-items:center;gap:22px;text-align:left;padding:18px 22px}.lesson b{font-family:"Cascadia Mono",Consolas,monospace;font-size:19px;white-space:nowrap}.lesson .date{margin-left:auto;color:var(--muted)}.back{margin-bottom:20px}.viewer{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:22px;margin-top:24px;align-items:start}.screen{background:#10242d;border-radius:9px;overflow:hidden}video{width:100%;display:block;max-height:68vh}video::cue{font-size:1.15rem;background:rgba(16,36,45,.88);color:#fff;border-radius:4px;padding:2px 8px;line-height:1.4;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.8)}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:0 0 9px 9px}.toolbar input{width:68px;padding:5px}.slide{background:white;border:1px solid var(--line);border-radius:9px;padding:16px;min-height:220px;display:flex;flex-direction:column;align-items:stretch}.slide-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}.slide-tools{display:flex;gap:8px;align-items:center}.slide-img-wrap{flex:1;display:grid;place-items:center;cursor:pointer;background:#fafbfc;border:1px dashed var(--line);border-radius:6px;padding:8px}.slide-img-wrap img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:4px;transition:transform .15s}.slide-img-wrap img:hover{filter:brightness(1.02)}.slide-sub-container{margin-top:14px;padding:12px 18px;background:#10242d;color:#fff;border-radius:8px;text-align:center;box-shadow:0 4px 14px rgba(16,36,45,.15);min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center}.slide-sub-label{font-size:11px;color:#65bbd1;letter-spacing:1px;margin-bottom:3px;font-weight:600;text-transform:uppercase}.slide-sub-text{font-size:18px;font-weight:500;line-height:1.4;color:#fff}.viewer.focus-slide{grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr)}.viewer.focus-slide #slide-box{order:1}.viewer.focus-slide #video-col{order:2}.viewer.focus-slide .slide-img-wrap img{max-height:70vh}.viewer.focus-slide .slide-sub-text{font-size:22px}.tabs{display:flex;gap:8px;margin:16px 0 12px}.tabs button[aria-selected=true]{background:var(--accent);color:white}.timeline{max-height:270px;overflow:auto;display:grid;gap:5px}.cue{padding:10px 12px;text-align:left;display:flex;gap:13px;border:0;background:transparent;line-height:1.6}.cue.active{background:var(--wash);color:#086a82}.cue time{font:12px "Cascadia Mono",Consolas,monospace;padding-top:4px;color:var(--muted);min-width:50px}.empty{padding:55px 20px;border:1px dashed var(--line);border-radius:10px;margin-top:25px;line-height:1.8}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;width:min(580px,90vw);color:var(--ink)}dialog::backdrop{background:#10242d66}#slide-lightbox{padding:0;background:rgba(11,23,29,.92);backdrop-filter:blur(6px);border:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;box-sizing:border-box;margin:0;overflow:hidden}#slide-lightbox::backdrop{background:rgba(0,0,0,.6)}form{display:grid;gap:12px}label{display:grid;gap:7px}input{border:1px solid var(--line);padding:10px;border-radius:6px;width:100%}.actions{display:flex;gap:10px;justify-content:flex-end}.primary{background:var(--accent);color:white}.resume-card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--white);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:16px 20px;margin:20px 0;box-shadow:0 4px 12px #17344205}.nav-btn{padding:5px 12px;font-size:13px}.nav-btn:disabled{opacity:0.35;cursor:not-allowed;border-color:var(--line);background:var(--white)}.hidden{display:none!important}@media(max-width:850px){.viewer{grid-template-columns:1fr!important}.viewer.focus-slide #slide-box{order:unset}.viewer.focus-slide #video-col{order:unset}header{flex-wrap:wrap;gap:15px}header nav{flex-wrap:wrap}.lesson{gap:10px}.lesson .date{font-size:12px}h1{font-size:26px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true"></span><strong>课程库</strong></div><nav><button id="download">检查并下载</button><button id="transfer">立即转存</button><button id="sync">同步字幕</button><button id="settings">设置</button></nav></header>
<main><div id="notice" role="status" class="muted"></div><section id="library"></section><section id="player" class="hidden"><button class="back" id="return">← 返回课次</button><h1 id="lesson-title"></h1><div class="muted" id="course-title"></div><div class="viewer" id="viewer-grid"><div id="video-col"><div class="screen"><video id="video" controls preload="metadata"></video></div><div class="toolbar"><button id="prev-lesson" class="nav-btn" title="上一节 (快捷键 [ )">⏮ 上一节</button><button id="next-lesson" class="nav-btn" title="下一节 (快捷键 ] )">⏭ 下一节</button><button id="toggle-focus-tb" class="nav-btn" title="切换课件/视频主屏 (快捷键 S)">⇄ 课件大屏</button><label style="display:flex;align-items:center;gap:6px">倍速 <select id="speed" style="padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:#fff"><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2.0x</option></select></label><label style="display:flex;align-items:center;gap:6px">字幕偏移 <input id="offset" type="number" value="0" step="0.5" aria-label="字幕偏移秒数"> 秒</label><label style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none"><input type="checkbox" id="autoplay" checked style="width:auto"> 自动连播下一节</label><button id="pip-btn" class="nav-btn" title="画中画悬浮窗 (快捷键 P)">📺 画中画</button><span class="muted" style="margin-left:auto;font-size:12px">快捷键: 空格 播放/暂停 · ←/→ ±5s · ↑/↓ 音量 · S 课件主屏 · Z 全屏原图 · [ / ] 上下节</span></div><div class="tabs"><button id="transcript-tab" aria-selected="true">字幕</button><button id="slides-tab" aria-selected="false">课件目录</button></div><div id="cues" class="timeline"></div><div id="pages" class="timeline hidden"></div></div><figure class="slide" id="slide-box"><div class="slide-header"><span id="slide-caption" class="muted">暂无课件</span><div class="slide-tools"><button id="toggle-focus" class="nav-btn" title="切换课件为主大屏 (快捷键 S)">⇄ 课件放大模式</button><button id="zoom-slide" class="nav-btn" title="全屏查看课件原图 (快捷键 Z)">🔍 全屏原图</button></div></div><div class="slide-img-wrap" id="slide-wrap" title="点击切换放大模式"><img id="slide" alt="当前课件"></div><div class="slide-sub-container" id="slide-sub-box"><div class="slide-sub-label">课件实时字幕</div><div class="slide-sub-text" id="slide-sub-text">（等待播放...）</div></div></figure></div></section></main>
<dialog id="slide-lightbox"><div style="display:flex;flex-direction:column;width:100%;height:100%;position:relative"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(16,36,45,.95);color:#fff"><strong id="lightbox-caption" style="font-size:16px">课件原图放大</strong><div style="display:flex;gap:10px;align-items:center"><button id="lightbox-pip" class="nav-btn" style="background:#147a91;color:#fff;border:0">📺 悬浮小窗视频</button><button id="close-lightbox" class="nav-btn" style="background:#fff;color:#173442">✕ 关闭 (Esc/Z)</button></div></div><div style="flex:1;display:grid;place-items:center;padding:16px;overflow:auto"><img id="lightbox-img" style="max-width:96vw;max-height:76vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.6)" alt="全屏课件"></div><div style="padding:14px 24px;background:rgba(16,36,45,.95);color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;border-top:1px solid #234857"><div style="font-size:11px;color:#65bbd1;letter-spacing:1px;font-weight:600">当前同步字幕</div><div id="lightbox-sub-text" style="font-size:21px;font-weight:500;color:#fff;text-align:center">（等待播放...）</div></div></div></dialog>
<dialog id="dialog"><form id="form"><h2>课程库设置</h2><label>视频目录<input name="destination" required></label><label>网络盘不可用时暂存到<input name="fallback" required></label><label>订阅课程编号或链接（逗号分隔）<input name="courses" required></label><label>每天自动转存时间<input name="transfer_time" type="time" required></label><details><summary>复旦账号环境变量</summary><p class="muted">保存为 FUDAN_STUID、FUDAN_UISPSW。以后也可直接在 Windows 环境变量中修改。</p><label>学号<input name="account" autocomplete="off"></label><label>密码（留空不修改）<input name="password" type="password" autocomplete="new-password"></label></details><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);let state,course,lesson,pages=[],cueRows=[],pageRows=[],originalCues=[],activeCue=-1;const video=$('video');
const stamp=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function media(c,file){return '/media/'+c.root+'/'+encodeURIComponent(c.folder)+'/'+file.split('/').map(encodeURIComponent).join('/')}
async function refresh(show=true){state=await(await fetch('/api/library')).json();if(show)showLibrary();$('notice').textContent=state.running?'正在处理，已下载的视频可直接观看。':state.last.errors?.length?'上次任务有未完成项目，点击检查并下载可重试。':state.last.error?'上次任务未完成，请检查网络和环境变量。':state.courses?.length?'本地课程库已就绪（已发现 '+state.courses.length+' 门课程），点击课程即可观看。':!state.configured?'请先在设置中保存复旦账号，或设置 FUDAN_STUID / FUDAN_UISPSW。':'视频目录暂无课程录像。'}
function showLibrary(){course=null;lesson=null;video.pause();$('player').classList.add('hidden');$('library').classList.remove('hidden');$('library').replaceChildren(el('h1','我的课程'),el('p','按课程选择录像，继续上次的学习。','muted'));try{const last=JSON.parse(localStorage.getItem('last_played')||'null');if(last&&state.courses){const c=state.courses.find(x=>x.folder===last.course_folder);if(c){const l=c.lessons.find(x=>x.name===last.lesson_name);if(l){const prog=Number(localStorage.getItem('progress/'+c.folder+'/'+l.name)||0);const card=el('div',undefined,'resume-card');const info=el('div');info.innerHTML='<span style="font-size:12px;text-transform:uppercase;color:var(--accent);font-weight:bold;letter-spacing:1px;display:block;margin-bottom:3px">继续上次学习</span><strong>'+c.title+'</strong> · '+l.name+' <span class="muted">(上次看到 '+stamp(prog)+')</span>';const btn=el('button','▶ 继续播放','primary nav-btn');btn.onclick=()=>play(c,l,true);card.append(info,btn);$('library').append(card)}}}}catch(e){}const grid=el('div',undefined,'course-grid');for(const c of state.courses){const b=el('button',undefined,'course');b.append(el('h2',c.title),el('span',c.lessons.length+' 节录像','muted'));if(c.staged)b.append(el('span','下载文件夹 · 待转存','badge'));b.onclick=()=>showCourse(c);grid.append(b)}$('library').append(grid);if(!state.courses.length)$('library').append(el('div','这里还没有课程录像。点击“检查并下载”，课程会按文件夹自动出现在这里。','empty'))}
function showCourse(c){course=c;video.pause();$('player').classList.add('hidden');$('library').classList.remove('hidden');const back=el('button','← 所有课程','back');back.onclick=showLibrary;const headerDiv=el('div');headerDiv.style.cssText='display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;';headerDiv.append(el('h1',c.title));if(c.lessons.length>0){const playFirst=el('button','▶ 从第 1 节开始连播','primary nav-btn');playFirst.onclick=()=>play(c,c.lessons[0],true);headerDiv.append(playFirst)}$('library').replaceChildren(back,headerDiv);const list=el('div',undefined,'lesson-list');for(const l of c.lessons){const b=el('button',undefined,'lesson');b.append(el('b',l.name),el('span',l.subtitle?'字幕已就绪':'字幕待同步','badge'),el('span',l.date||'','date'));b.onclick=()=>play(c,l,true);list.append(b)}$('library').append(list)}
function setFocusMode(focus){const v=$('viewer-grid');v.classList.toggle('focus-slide',focus);const txt=focus?'⇄ 视频放大模式':'⇄ 课件放大模式';$('toggle-focus').textContent=txt;$('toggle-focus-tb').textContent=focus?'⇄ 视频主屏':'⇄ 课件主屏';localStorage.setItem('slide_focus',focus?'1':'0')}
$('toggle-focus').onclick=()=>setFocusMode(!$('viewer-grid').classList.contains('focus-slide'));
$('toggle-focus-tb').onclick=$('toggle-focus').onclick;
$('slide-wrap').onclick=()=>setFocusMode(!$('viewer-grid').classList.contains('focus-slide'));
function openLightbox(){if(!$('slide').getAttribute('src'))return;$('lightbox-img').src=$('slide').src;$('lightbox-caption').textContent=$('slide-caption').textContent;$('lightbox-sub-text').textContent=$('slide-sub-text').textContent;$('slide-lightbox').showModal()}
function closeLightbox(){$('slide-lightbox').close()}
$('zoom-slide').onclick=openLightbox;$('close-lightbox').onclick=closeLightbox;
$('lightbox-pip').onclick=async()=>{try{if(video.readyState>0&&!document.pictureInPictureElement)await video.requestPictureInPicture()}catch(e){}};
async function play(c,l,autoStart=false){lesson=l;course=c;$('library').classList.add('hidden');$('player').classList.remove('hidden');$('lesson-title').textContent=l.name;$('course-title').textContent=c.title;localStorage.setItem('last_played',JSON.stringify({course_folder:c.folder,lesson_name:l.name,time:Date.now()}));const idx=c.lessons.findIndex(x=>x.name===l.name);$('prev-lesson').disabled=(idx<=0);$('next-lesson').disabled=(idx<0||idx>=c.lessons.length-1);$('prev-lesson').onclick=()=>{if(idx>0)play(c,c.lessons[idx-1],true)};$('next-lesson').onclick=()=>{if(idx>=0&&idx<c.lessons.length-1)play(c,c.lessons[idx+1],true)};video.replaceChildren();video.src=media(c,l.video);pages=[];cueRows=[];pageRows=[];originalCues=[];activeCue=-1;$('cues').replaceChildren();$('pages').replaceChildren();$('slide').removeAttribute('src');$('slide-caption').textContent='暂无课件';$('slide-sub-text').textContent='（等待播放...）';const key=c.folder+'/'+l.name;$('offset').value=localStorage.getItem('offset/'+key)||0;const savedSpeed=localStorage.getItem('playback_speed')||'1';$('speed').value=savedSpeed;video.playbackRate=Number(savedSpeed)||1.0;setFocusMode(localStorage.getItem('slide_focus')==='1');video.onloadedmetadata=()=>{const t=Number(localStorage.getItem('progress/'+key)||0);if(t>0&&t<video.duration-5)video.currentTime=t;if(autoStart)video.play().catch(()=>{})};if(l.subtitle){const tr=document.createElement('track');tr.kind='subtitles';tr.srclang='zh';tr.label='中文字幕';tr.default=true;tr.src=media(c,l.name+'.vtt');tr.onload=()=>{tr.track.mode='showing';originalCues=Array.from(tr.track.cues||[]).map(q=>({cue:q,start:q.startTime,end:q.endTime}));for(const q of originalCues){const b=el('button',undefined,'cue');b.append(el('time',stamp(q.start)),el('span',q.cue.text));b.onclick=()=>video.currentTime=q.cue.startTime;cueRows.push(b);$('cues').append(b)}applyOffset()};video.append(tr)}else $('cues').append(el('p','字幕生成后，点击“同步字幕”即可补齐。','muted'));try{const r=await fetch(media(c,l.name+'.assets/timeline.json'));if(r.ok)pages=await r.json()}catch{}for(const p of pages){const b=el('button',undefined,'cue');b.append(el('time',stamp(p.time)),el('span','课件 '+(pageRows.length+1)));b.onclick=()=>{if(p.time<=video.duration)video.currentTime=p.time};pageRows.push(b);$('pages').append(b)}updateTime()}
function applyOffset(){const d=Number($('offset').value)||0;for(const q of originalCues){q.cue.startTime=Math.max(0,q.start+d);q.cue.endTime=Math.max(q.cue.startTime+.01,q.end+d)}localStorage.setItem('offset/'+course.folder+'/'+lesson.name,d)}$('offset').onchange=applyOffset;
function updateTime(){if(!lesson)return;const t=video.currentTime;localStorage.setItem('progress/'+course.folder+'/'+lesson.name,t);let p=-1;pages.forEach((q,i)=>{if(q.time<=t)p=i});pageRows.forEach((r,i)=>r.classList.toggle('active',i===p));if(p>=0){const src=media(course,lesson.name+'.assets/'+pages[p].file);if($('slide').getAttribute('src')!==src){$('slide').src=src;if($('slide-lightbox').open)$('lightbox-img').src=src}$('slide-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time);if($('slide-lightbox').open)$('lightbox-caption').textContent='课件 '+(p+1)+' · '+stamp(pages[p].time)}else{$('slide').removeAttribute('src');$('slide-caption').textContent='此时间暂无课件';if($('slide-lightbox').open){$('lightbox-img').removeAttribute('src');$('lightbox-caption').textContent='此时间暂无课件'}}const ci=originalCues.findIndex(q=>t>=q.cue.startTime&&t<q.cue.endTime);if(ci!==activeCue){cueRows.forEach((r,i)=>r.classList.toggle('active',i===ci));activeCue=ci;if(ci>=0){cueRows[ci].scrollIntoView({block:'nearest'});const txt=originalCues[ci].cue.text;$('slide-sub-text').textContent=txt;if($('slide-lightbox').open)$('lightbox-sub-text').textContent=txt}else{$('slide-sub-text').textContent='（静音 / 无字幕）';if($('slide-lightbox').open)$('lightbox-sub-text').textContent='（静音 / 无字幕）'}}}video.ontimeupdate=updateTime;
$('return').onclick=()=>showCourse(course);$('transcript-tab').onclick=()=>tab(true);$('slides-tab').onclick=()=>tab(false);function tab(sub){$('cues').classList.toggle('hidden',!sub);$('pages').classList.toggle('hidden',sub);$('transcript-tab').setAttribute('aria-selected',sub);$('slides-tab').setAttribute('aria-selected',!sub)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Course-Token':state.token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}async function run(command){try{await post('/api/run',{command});$('notice').textContent='任务已开始，完成后课程库会自动刷新。'}catch(e){$('notice').textContent=e.message}}$('download').onclick=()=>run('download');$('transfer').onclick=()=>run('transfer');$('sync').onclick=()=>run('subtitles');$('settings').onclick=()=>{for(const k of ['destination','fallback','transfer_time'])$('form').elements[k].value=state.settings[k];$('form').elements.courses.value=state.settings.courses.join(',');$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=async e=>{e.preventDefault();try{await post('/api/settings',Object.fromEntries(new FormData(e.target)));e.target.elements.password.value='';$('dialog').close();await refresh(!$('player').classList.contains('hidden')?false:true)}catch(err){$('notice').textContent=err.message;$('dialog').close()}};refresh();setInterval(()=>refresh($('player').classList.contains('hidden')&&!course),15000);
$('speed').onchange=()=>{const sp=Number($('speed').value)||1.0;video.playbackRate=sp;localStorage.setItem('playback_speed',String(sp))};
$('autoplay').checked=localStorage.getItem('autoplay_next')!=='0';
$('autoplay').onchange=()=>localStorage.setItem('autoplay_next',$('autoplay').checked?'1':'0');
video.onended=()=>{if($('autoplay').checked&&course&&lesson){const idx=course.lessons.findIndex(x=>x.name===lesson.name);if(idx>=0&&idx<course.lessons.length-1){const nextL=course.lessons[idx+1];$('notice').textContent='本节已播完，自动连播下一节：'+nextL.name;play(course,nextL,true)}else{$('notice').textContent='本课程录像已全部播放完毕。'}}};
$('pip-btn').onclick=async()=>{try{if(document.pictureInPictureElement){await document.exitPictureInPicture()}else if(video.readyState>0){await video.requestPictureInPicture()}}catch(e){console.warn(e)}};
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}else if(e.code==='ArrowLeft'){e.preventDefault();video.currentTime=Math.max(0,video.currentTime-5)}else if(e.code==='ArrowRight'){e.preventDefault();video.currentTime=Math.min(video.duration||0,video.currentTime+5)}else if(e.code==='ArrowUp'){e.preventDefault();video.volume=Math.min(1,video.volume+0.1)}else if(e.code==='ArrowDown'){e.preventDefault();video.volume=Math.max(0,video.volume-0.1)}else if(e.code==='KeyF'){e.preventDefault();if(document.fullscreenElement){document.exitFullscreen()}else{(video.requestFullscreen?video.requestFullscreen():$('player').requestFullscreen()).catch(()=>{})}}else if(e.code==='KeyM'){e.preventDefault();video.muted=!video.muted}else if(e.code==='KeyP'){e.preventDefault();$('pip-btn').click()}else if(e.code==='KeyS'){e.preventDefault();setFocusMode(!$('viewer-grid').classList.contains('focus-slide'))}else if(e.code==='KeyZ'){e.preventDefault();$('slide-lightbox').open?closeLightbox():openLightbox()}else if(e.code==='Escape'&&$('slide-lightbox').open){e.preventDefault();closeLightbox()}else if(e.code==='BracketLeft'){e.preventDefault();$('prev-lesson').click()}else if(e.code==='BracketRight'){e.preventDefault();$('next-lesson').click()}});
</script></body></html>
