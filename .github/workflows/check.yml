name: iCourse Check

on:
  schedule:
    # 每天北京时间 06:00, 12:00, 18:00, 24:00 (UTC 22:00, 04:00, 10:00, 16:00) 运行一次
    - cron: "0 4-22/6 * * *"
  workflow_dispatch:
    inputs:
      probe_only:
        description: "Only check for new recordings; do not force ASR processing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: icourse-check
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.probe.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome
      - name: Load subscriptions from data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FUDAN_STUID: ${{ secrets.STUID }}
          FUDAN_UISPSW: ${{ secrets.UISPSW }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_PREVIOUS: ${{ secrets.DB_PASSWORD_PREVIOUS }}
        run: python scripts/resolve_subscriptions.py --mode check
      - name: Check new recordings and missing subtitle timelines
        id: probe
        env:
          FUDAN_STUID: ${{ secrets.STUID }}
          FUDAN_UISPSW: ${{ secrets.UISPSW }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_PREVIOUS: ${{ secrets.DB_PASSWORD_PREVIOUS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_new_replays.py
  check:
    needs: discover
    if: (needs.discover.outputs.needed == 'true' || github.event_name == 'workflow_dispatch') && inputs.probe_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}/lib/python*/site-packages
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Load subscriptions from data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FUDAN_STUID: ${{ secrets.STUID }}
          FUDAN_UISPSW: ${{ secrets.UISPSW }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_PREVIOUS: ${{ secrets.DB_PASSWORD_PREVIOUS }}
        run: python scripts/resolve_subscriptions.py --mode check

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache ASR models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/
            silero_vad.onnx
          key: asr-models-sense-voice-2024-07-17

      - name: Download ASR models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xf sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          rm sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

      - name: Cache RapidOCR models
        uses: actions/cache@v4
        with:
          path: ~/.cache/rapidocr
          key: rapidocr-onnx-default-v1

      - name: Fetch database from data branch
        run: |
          mkdir -p data
          # Force-fetch (+refspec) so non-fast-forward updates from
          # force-pushed data branches are picked up (shallow clone
          # otherwise refuses to overwrite the stale tracking ref).
          git fetch --depth=1 origin "+refs/heads/data:refs/remotes/origin/data" 2>/dev/null \
            || { echo "No data branch, starting fresh."; exit 0; }
          # Use ls-tree (reads tree directly) instead of cat-file
          # (requires fetched blobs) in case the shallow clone hasn't
          # fetched every blob object yet.
          git ls-tree origin/data --name-only data/ | grep -q . \
            || { echo "No database found on data branch, starting fresh."; exit 0; }
          # Determine format from tree listing (ls-tree reads tree
          # objects directly without needing the blobs fetched).
          files=$(git ls-tree origin/data --name-only data/ | tr '\n' ' ')
          echo "Data branch files: $files"
          if echo "$files" | grep -q "icourse-index.enc"; then
            mkdir -p data/sharded/shards
            git show origin/data:data/icourse-index.enc > data/sharded/icourse-index.enc
            shard_paths=$(git ls-tree -r --name-only origin/data | grep '^data/shards/' || true)
            for path in $shard_paths; do
              base=$(basename "$path")
              git show "origin/data:$path" > "data/sharded/shards/$base"
            done
            echo "Loaded $(ls data/sharded/shards 2>/dev/null | wc -l) shard(s)."
          elif echo "$files" | grep -q "icourse.db.gz.enc"; then
            git show origin/data:data/icourse.db.gz.enc > data/icourse.db.gz.enc
            echo "Loaded legacy compressed database."
          elif echo "$files" | grep -q "icourse.db.enc"; then
            git show origin/data:data/icourse.db.enc > data/icourse.db.enc
            echo "Loaded legacy uncompressed database."
          else
            echo "No database found on data branch, starting fresh."
          fi

      - name: Decode database
        id: decode
        if: hashFiles('data/sharded/icourse-index.enc', 'data/icourse.db.gz.enc', 'data/icourse.db.enc') != ''
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_PREVIOUS: ${{ secrets.DB_PASSWORD_PREVIOUS }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -f data/sharded/icourse-index.enc ]; then
            python scripts/db_shard.py reassemble data/sharded data/icourse.db
          elif [ -f data/icourse.db.gz.enc ]; then
            python scripts/db_shard.py decode-legacy data/icourse.db.gz.enc data/icourse.db
          elif [ -f data/icourse.db.enc ]; then
            python scripts/db_shard.py decode-legacy data/icourse.db.enc data/icourse.db
          fi

      - name: Record database state
        id: db-before
        run: |
          if [ -f data/icourse.db ]; then
            echo "hash=$(md5sum data/icourse.db | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "hash=none" >> $GITHUB_OUTPUT
          fi

      - name: Run
        id: pipeline
        timeout-minutes: 110
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          CRAWL_TERM: ${{ secrets.CRAWL_TERM }}
        run: |
          python -u main.py

      - name: Deploy database to data branch
        if: always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_PREVIOUS: ${{ secrets.DB_PASSWORD_PREVIOUS }}
          # Resolved from data/subscriptions.json by the earlier step.
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/icourse.db ]; then
            echo "No database file, skipping."
            exit 0
          fi

          AFTER=$(md5sum data/icourse.db | cut -d' ' -f1)
          if [ "$AFTER" = "${{ steps.db-before.outputs.hash }}" ] && [ "${{ steps.decode.outputs.needs_rekey }}" != "true" ] && [ "$SUBSCRIPTIONS_NEEDS_MIGRATION" != "1" ]; then
            echo "Database unchanged, skipping commit."
            exit 0
          fi

          # Pull the latest remote shards (a concurrent run may have written
          # new data) and merge our local changes in before re-sharding.
          git fetch origin data --depth=1 2>/dev/null || echo "No data branch yet."
          DEPLOY_DB=data/icourse.db
          if git rev-parse origin/data >/dev/null 2>&1 && \
             git cat-file -e origin/data:data/icourse-index.enc 2>/dev/null; then
            rm -rf data/remote_sharded
            mkdir -p data/remote_sharded/shards
            git show origin/data:data/icourse-index.enc > data/remote_sharded/icourse-index.enc
            shard_paths=$(git ls-tree -r --name-only origin/data | grep '^data/shards/' || true)
            for path in $shard_paths; do
              base=$(basename "$path")
              git show "origin/data:$path" > "data/remote_sharded/shards/$base"
            done
            python scripts/db_shard.py reassemble data/remote_sharded data/remote.db
            echo "Merging local changes into latest remote..."
            python scripts/merge_db.py data/icourse.db data/remote.db
            DEPLOY_DB=data/remote.db
          fi

          # Re-shard the merged DB and stage to a clean tree for force-push.
          rm -rf data/sharded_out
          mkdir -p data/sharded_out
          python scripts/db_shard.py shard "$DEPLOY_DB" data/sharded_out

          rm -rf /tmp/db_deploy
          mkdir -p /tmp/db_deploy/data/shards
          cp data/sharded_out/icourse-index.enc /tmp/db_deploy/data/
          cp data/sharded_out/shards/*.db.gz.enc /tmp/db_deploy/data/shards/
          cd /tmp/db_deploy

          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Save the *latest* subscription manifest, not a potentially stale
          # copy fetched at the beginning of this long-running ASR job.
          expected=$(git ls-remote origin refs/heads/data | cut -f1)
          if [ -n "$expected" ]; then
            git fetch --depth=1 origin data
          fi
          if [ -z "$expected" ] || ! git show FETCH_HEAD:data/subscriptions.json > data/subscriptions.json 2>/dev/null; then
            python "$GITHUB_WORKSPACE/scripts/write_subscriptions.py" data/subscriptions.json
          fi
          git add data/
          git commit -q -m "chore: update encrypted database (sharded v2)"
          # A concurrent frontend edit must not be silently overwritten.
          git push --force-with-lease="refs/heads/data:${expected}" origin data
